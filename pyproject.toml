[project]
name = "ppt-to-video"
version = "0.1.0"
description = "将PPT转换为数字人讲解视频的工具"
authors = [
    {name = "flyingtimes", email = "your.email@example.com"},
]
dependencies = [
    "python-pptx>=0.6.21",
    "pillow>=9.0.0",
    "requests>=2.28.0",
    "python-dotenv>=0.19.0",
    "tqdm>=4.64.0",
    "pdf2image>=1.16.0",
    "python-docx>=0.8.11",
    "reportlab>=4.0.0",
]
requires-python = ">=3.8"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
ppt-to-video = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]
